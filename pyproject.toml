[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "contextos"
version = "0.1.0"
description = "An operating-system-inspired memory manager for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.7",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",        # for FastAPI test client
    "ruff>=0.4",
]
openai = ["openai>=1.30"]
ollama = ["ollama>=0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["contextos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
