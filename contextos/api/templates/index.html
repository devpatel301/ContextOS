<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextOS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar" style="padding: 0.75rem 2rem;">
        <div class="nav-container" style="display: flex; justify-content: center; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; position: relative;">
            <h1 style="margin: 0; color: var(--white); font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase;">ContextOS Profiler</h1>
            <button id="reset-memory-btn" class="button" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); background-color: var(--accent-orange); font-size: 0.8rem; padding: 0.4rem 0.8rem; margin: 0; white-space: nowrap; max-width: none; box-shadow: 2px 2px 0 var(--black); width: auto;">Reset Memory</button>
        </div>
    </nav>

    <div class="content-container">
        
        <div class="metrics-grid">
            <div class="card metric-card" style="background-color: var(--primary-yellow);">
                <h3>Memory Tiers</h3>
                <div id="tier-stats" class="stats-list">Loading...</div>
            </div>
            
            <div class="card metric-card" style="background-color: var(--primary-purple);">
                <h3>Token Budget</h3>
                <div class="budget-bar-container">
                    <div id="budget-fill" class="budget-fill"></div>
                </div>
                <p id="budget-text" class="stat-text">Loading...</p>
            </div>
            
            <div class="card metric-card" style="background-color: var(--skills-bg);">
                <h3>Semantic Cache</h3>
                <div id="cache-stats" class="stats-list">Loading...</div>
                <div style="margin-top: 1rem; border-top: 2px solid var(--black); padding-top: 0.8rem;">
                    <label for="threshold-slider" style="font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 0.2rem;">Match Threshold: <span id="threshold-val">0.85</span></label>
                    <input type="range" id="threshold-slider" min="0.50" max="0.99" step="0.01" value="0.85" style="width: 100%; accent-color: var(--accent-orange); cursor: pointer; border: 2px solid var(--black); border-radius: 4px; background: var(--white); height: 8px;">
                </div>
            </div>
        </div>

        <div class="section-tab">
            <h2>Context Scheduler</h2>
        </div>
        <div class="section-content console-bg">
            <div class="console-layout">
                <div class="query-panel">
                    <label>Simulate Query</label>
                    <textarea id="query-input" class="neo-textarea" placeholder="Ask the agent something..."></textarea>
                    <button id="run-query-btn" class="button">Allocate Context</button>
                    <div id="query-spinner" class="spinner" style="display: none;"></div>
                    <div id="query-status" class="status-msg"></div>
                </div>
                <div class="window-panel">
                    <label>Packed Context Window</label>
                    <div id="context-window-blocks" class="blocks-container">
                        <div class="empty-state">Run a query to see the packed context window.</div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
